name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Releases are cut by hand: Actions > CI > Run workflow, on main, with the kind of bump
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise for the release
        type: choice
        options: [patch, minor, major]
        default: patch

# Read-only by default; the release job asks for more on its own.
permissions:
  contents: read

# One run per branch or pull request at a time. A newer push to a pull request
# cancels the run in progress; runs on main are never cancelled (the release
# job tags), they queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 images were retired; a job on that label never gets a runner
        os: [ubuntu-24.04, ubuntu-22.04, macos-15, macos-26]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive

    # macOS runners need nothing extra: the tests use the system tools and zsh
    - name: Install dependencies (Linux)
      if: startsWith(runner.os, 'Linux')
      run: |
        # zsh is needed by test/adapters/zsh.bats (skipped when it is missing)
        # The runners' package mirrors fail to resolve now and then: retry before giving up
        for attempt in 1 2 3 4 5; do
          sudo apt-get update && sudo apt-get install -y zsh && break
          if [ "$attempt" = 5 ]; then exit 1; fi
          echo "apt failed (attempt $attempt), retrying in 20 seconds"; sleep 20
        done

    - name: Run tests (Linux)
      if: startsWith(runner.os, 'Linux')
      shell: 'script -q -e -c "bash {0}"'
      run: test/run

    - name: Run tests (macOS)
      if: startsWith(runner.os, 'macOS')
      run: script -q /dev/null bash -c 'test/run'

  lint:
    runs-on: ubuntu-latest

    steps:
    # No submodules here: bin/bats-* are vendored third-party test tools, and
    # components/aliases, components/completions and components/plugins are
    # the shared component repositories, which are linted and formatted in
    # their own repositories. None of them is project code.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install shellcheck
      run: |
        # The runners' package mirrors fail to resolve now and then: retry before giving up
        for attempt in 1 2 3 4 5; do
          sudo apt-get update && sudo apt-get install -y shellcheck && break
          if [ "$attempt" = 5 ]; then exit 1; fi
          echo "apt failed (attempt $attempt), retrying in 20 seconds"; sleep 20
        done

    # A fixed version built from source (checked against the Go checksum
    # database), instead of piping an install script from the network to sh.
    - name: Install shfmt
      run: |
        go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    # Everything the project wrote: the core, the adapters, the theme, its own
    # components (components/host), the hooks and the tests. A finding fails
    # the job. bin/ and the three component submodules are not checked out
    # here, and are left out by name so that the same command gives the same
    # result in a checkout that has them.
    - name: Run shellcheck (core, theme, own components, tests)
      run: |
        {
          find . \( -name '*.bash' -o -name '*.sh' -o -name '*.bats' \) \
            -not -path './bin/*' \
            -not -path './components/aliases/*' \
            -not -path './components/plugins/*' \
            -not -path './components/completions/*'
          echo ./hooks/pre-push
        } | sort | xargs shellcheck --shell=bash

    # Same scope as the shfmt hook in .pre-commit-config.yaml, which leaves
    # adapters/zsh/, the component submodules, the theme and the zsh half of
    # the gshell completion unformatted.
    - name: Run shfmt
      run: |
        shfmt -f . | grep -vE '^(adapters/zsh/|components/(aliases|completions|plugins|themes)/|components/host/.*\.zsh$|bin/)' | xargs shfmt -d

  release:
    # Only a run started by hand on main releases; pushes and pull requests never tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-latest
    # The only job that writes to the repository (a tag and a release)
    permissions:
      contents: write
    # Releases run one after the other, so two pushes cannot work out the same
    # next tag.
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Bump version and tag
      id: tag
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        if git describe --exact-match HEAD 2>/dev/null; then
          echo "HEAD already tagged, skipping"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        VERSION="${LATEST_TAG#v}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        case "$BUMP" in
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          *) PATCH=$((PATCH + 1)) ;;
        esac
        NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
        git push origin "$NEW_TAG"
        echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

    # The run is for a branch push, so the release step has to be told which
    # tag to release; without tag_name it fails with "requires a tag".
    - name: Create GitHub Release
      if: steps.tag.outputs.skip != 'true'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        generate_release_notes: true
